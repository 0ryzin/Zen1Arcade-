# SPDX-License-Identifier: GPL-3.0-or-later
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SDL3_TAG: release-3.4.20

permissions:
  contents: write   # publish the development pre-release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Ubuntu 22.04 (glibc 2.35) so the AppImage also runs on older systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-12 g++-12 cmake ninja-build file patchelf zlib1g-dev ffmpeg zip \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qmake6 libqt6opengl6-dev libvulkan-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libdrm-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libfuse2

      - name: Cache SDL3
        id: sdl3-cache
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL3_TAG }}-ubuntu-22.04-v1

      - name: Build SDL3
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl3 -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl3-build
          sudo cmake --install sdl3-build

      - name: Configure
        run: |
          # GCC 12: the 68000 core (Moira) needs full C++20 support.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_PREFIX_PATH=/opt/sdl3 -DCMAKE_INSTALL_PREFIX=/usr
          # Fail loudly if either program was skipped.
          grep -q zen1-engine build/build.ninja
          grep -q zen1-arcade build/build.ninja

      - name: Build
        run: cmake --build build -- -k 0

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Engine checks (no screen)
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_RENDER_DRIVER: software
          SDL_AUDIO_DRIVER: dummy
          ZEN1_DATA_ROOT: ${{ runner.temp }}/zen1-ci-root
          LD_LIBRARY_PATH: /opt/sdl3/lib
        run: |
          E=build/apps/engine/zen1-engine
          $E --test-card --windowed --size 1280x1024 --frames 60 --screenshot engine-test-card.bmp
          test -s engine-test-card.bmp
          test -d "$ZEN1_DATA_ROOT/Games"
          # The CPS1 hardware running Zen1's own test program (no ROM files).
          $E --cps1-selftest --windowed --size 1280x1024 --frames 240 --screenshot engine-cps1-selftest.bmp
          $E --cps1-selftest --windowed --size 1280x1024 --frames 120 --rotate 90 --bezel black
          # Library data for the frontend.
          $E --list-games | python3 -c "import json,sys; g=json.load(sys.stdin); assert {x['set'] for x in g} >= {'sf2','sf2ce','ffight','1941','pacman','galaxian','mslug','kof97','sfa3','ssf2t','1942'}"
          touch "$ZEN1_DATA_ROOT/Games/notreal.zip"
          $E --scan | python3 -c "import json,sys; d=json.load(sys.stdin); s={x['set']:x['status'] for x in d['games']}; print(s); assert s['sf2']=='missing' and s['notreal']=='unsupported'"
          rm "$ZEN1_DATA_ROOT/Games/notreal.zip"
          # A missing ROM set is reported (exit code 3) before any window opens.
          set +e; $E --game sf2; code=$?; set -e
          test "$code" = 3
          ffmpeg -loglevel error -y -i engine-test-card.bmp engine-test-card.png
          ffmpeg -loglevel error -y -i engine-cps1-selftest.bmp engine-cps1-selftest.png
          # Console cartridges are found by extension, also inside a zip.
          python3 tools/make_test_roms.py "$ZEN1_DATA_ROOT/Games/Consoles" > /dev/null
          $E --scan | python3 -c "import json,sys; d=json.load(sys.stdin); c={x['console']:x['status'] for x in d['games'] if x.get('console')}; print(c); assert c=={'gg':'ready','gbc':'ready'}"
          rm -r "$ZEN1_DATA_ROOT/Games/Consoles"

      - name: Console smoke tests (test and homebrew cartridges, no screen)
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_RENDER_DRIVER: software
          SDL_AUDIO_DRIVER: dummy
          ZEN1_DATA_ROOT: ${{ runner.temp }}/zen1-ci-root
          LD_LIBRARY_PATH: /opt/sdl3/lib
        run: |
          # Freely available test ROMs are fetched from their own repositories
          # here (never bundled); see docs/COMPATIBILITY.md.
          tools/console_smoke.sh build/apps/engine/zen1-engine console-tests "${{ runner.temp }}/console-roms"
          cat console-tests/results.md >> "$GITHUB_STEP_SUMMARY"
          for f in console-tests/*.bmp; do ffmpeg -loglevel error -y -i "$f" "${f%.bmp}.png" && rm "$f"; done
          sed -i 's/\.bmp |/.png |/' console-tests/results.md
          zip -qr console-tests.zip console-tests

      - name: Frontend checks and intro video (no screen)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          ZEN1_DATA_ROOT: ${{ runner.temp }}/zen1-ci-root
          LD_LIBRARY_PATH: /opt/sdl3/lib
          SDL_AUDIO_DRIVER: dummy
        run: |
          set -o pipefail
          F="build/apps/frontend/zen1-arcade --windowed --size 1280x1024"
          mkdir -p shots
          : > fe.log
          run() { "$@" 2>&1 | tee -a fe.log; }
          run $F --screenshot shots/library-real.png --page library
          run $F --demo-library --screenshot shots/library.png --page library
          run $F --demo-library --screenshot shots/insert-coin.png --page coin
          run $F --demo-library --screenshot shots/settings.png --page settings
          run $F --demo-library --screenshot shots/controllers.png --page controls
          run $F --demo-library --screenshot shots/controller-test.png --page test
          run $F --demo-library --screenshot shots/buttons.png --page buttons
          # The start-up scene: intro marks, then the settled INSERT COIN idle
          # state (same scene) - also on other screen shapes.
          for t in 400 1200 1900 2500 3200 4500 8000; do
            run $F --screenshot shots/intro-$t.png --page intro --intro-time $t
          done
          for sz in 1920x1080 1280x800 1024x768 800x1280; do
            run build/apps/frontend/zen1-arcade --windowed --size $sz --demo-library --screenshot shots/attract-$sz.png --page intro --intro-time 8000
          done
          run build/apps/frontend/zen1-arcade --record-intro intro-frames --fps 30
          # Any QML warning (binding loops, type errors, missing ids) fails the build.
          if grep -E "qrc:/qml/" fe.log; then echo "QML warnings found"; exit 1; fi
          ffmpeg -loglevel error -y -framerate 30 -i intro-frames/frame_%04d.png -i intro-frames/intro.wav \
            -c:v libx264 -pix_fmt yuv420p -crf 18 -c:a aac -b:a 192k -shortest zen1-intro-preview.mp4
          ls -la zen1-intro-preview.mp4 shots

      - name: Static diagnostic tool
        run: |
          cmake -S . -B build-diag -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
            -DZEN1_BUILD_ENGINE=OFF -DZEN1_BUILD_FRONTEND=OFF -DZEN1_BUILD_TESTS=OFF \
            -DZEN1_STATIC_DIAG=ON
          cmake --build build-diag --target zen1-diag
          file build-diag/apps/diag/zen1-diag | grep -q "statically linked"
          strip build-diag/apps/diag/zen1-diag

      - name: AppImage
        env:
          LD_LIBRARY_PATH: /opt/sdl3/lib
          QMAKE: /usr/lib/qt6/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/apps/frontend/qml
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # xcb (X11/XWayland) is bundled by default; offscreen is for automated checks.
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
        run: |
          DESTDIR=AppDir cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/zen1-arcade \
            --executable AppDir/usr/bin/zen1-engine \
            --desktop-file packaging/zen1-arcade.desktop \
            --icon-file packaging/zen1-arcade.png \
            --plugin qt --output appimage
          mv Zen1_Arcade-*.AppImage Zen1Arcade-x86_64.AppImage
          ls -la Zen1Arcade-x86_64.AppImage

      - name: AppImage smoke test (no screen)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ZEN1_DATA_ROOT: ${{ runner.temp }}/zen1-appimage-root
          SDL_VIDEO_DRIVER: offscreen
          SDL_RENDER_DRIVER: software
        run: |
          ./Zen1Arcade-x86_64.AppImage --skip-intro --screenshot appimage-shell.png 2> appimage.log
          cat appimage.log
          test -s appimage-shell.png
          if grep -E "qrc:/qml/" appimage.log; then exit 1; fi
          # The bundled engine must run from inside the AppImage too.
          ./Zen1Arcade-x86_64.AppImage --appimage-extract > /dev/null
          LD_LIBRARY_PATH=squashfs-root/usr/lib squashfs-root/usr/bin/zen1-engine \
            --test-card --windowed --size 1280x1024 --frames 30
          LD_LIBRARY_PATH=squashfs-root/usr/lib squashfs-root/usr/bin/zen1-engine \
            --cps1-selftest --windowed --size 1280x1024 --frames 30
          ldd squashfs-root/usr/bin/zen1-engine | grep -i sdl3

      - name: Publish development build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build-diag/apps/diag/zen1-diag zen1-diag
          gh release delete dev-latest --yes --cleanup-tag || true
          cp shots/library.png screenshot-library.png
          cp shots/settings.png screenshot-settings.png
          cp shots/controllers.png screenshot-controllers.png
          cp shots/intro-2500.png screenshot-intro.png
          cp shots/insert-coin.png screenshot-insert-coin.png
          cp shots/controller-test.png screenshot-controller-test.png
          cp shots/buttons.png screenshot-buttons.png
          gh release create dev-latest Zen1Arcade-x86_64.AppImage zen1-diag zen1-intro-preview.mp4 \
            screenshot-library.png screenshot-settings.png screenshot-controllers.png screenshot-intro.png \
            screenshot-insert-coin.png screenshot-controller-test.png screenshot-buttons.png \
            engine-cps1-selftest.png engine-test-card.png console-tests.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Development build (${GITHUB_SHA::7})" \
            --notes-file packaging/RELEASE_NOTES.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zen1arcade-linux-x86_64
          path: |
            Zen1Arcade-x86_64.AppImage
            build-diag/apps/diag/zen1-diag
            engine-test-card.png
            engine-cps1-selftest.png
            zen1-intro-preview.mp4
            shots/
            console-tests/
          if-no-files-found: error
